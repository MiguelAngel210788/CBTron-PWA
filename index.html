<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CBTron se mudó</title>
  <meta http-equiv="refresh" content="3;url=https://cbtron-507a1.web.app/">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #050814; color: #e8f3ff; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
    a { display: inline-block; margin-top: 16px; padding: 12px 22px; border-radius: 999px; background: #22d3ee; color: #031018; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>CBTron tiene nueva dirección</h1>
    <p>La app ahora vive en <strong>cbtron-507a1.web.app</strong> y abre también con datos móviles.<br>Si instalaste la app anterior, desinstálala e instala la nueva.</p>
    <a id="go" href="https://cbtron-507a1.web.app/">Ir a CBTron</a>
  </main>
  <script>
    (function () {
      var target = 'https://cbtron-507a1.web.app/' + (location.search || '');
      document.getElementById('go').href = target;
      if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (list) { list.forEach(function (r) { r.unregister(); }); }).catch(function () {});
      setTimeout(function () { location.replace(target); }, 1500);
    })();
  </script>
</body>
</html>
